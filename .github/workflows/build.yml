# Builds Oats on real runners and attaches the results to the run:
#   Oats-Setup     dist/Oats-Setup-<version>.exe, with npm's win32 builds of whisper.cpp
#                  and sherpa-onnx, after a smoke test of the packaged audio sidecar
#   Oats-mac-arm64 Oats.app for Apple Silicon (Swift sidecar + TCC addon), signed ad hoc
#   Oats-mac-x64   Oats.app for Intel Macs (Node sidecar + universal TCC addon), signed ad
#                  hoc, after the same sidecar smoke test as Windows
# On v* tags all three are also uploaded to Cloudflare R2 for the landing page (publish job).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs-only changes don't need three builds. GitHub skips path filters for tag pushes,
    # so a release always builds.
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run still in progress. Tag runs are
# never cancelled, so a release can't be cut off halfway through publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# .env isn't in the repo, so the builds get their site here: Google and Yandex sign in
# through the Oats site's Worker, which holds the OAuth secrets, and the app looks for
# new releases in its /download/latest/. Override with the repository variables of the
# same names.
env:
  MAIN_VITE_AUTH_URL: ${{ vars.MAIN_VITE_AUTH_URL || 'https://oats-site.azbykov.workers.dev' }}
  MAIN_VITE_UPDATE_URL: ${{ vars.MAIN_VITE_UPDATE_URL || 'https://oats-site.azbykov.workers.dev' }}

jobs:
  windows:
    # A release commit ("Version x.y.z") is pushed to main next to its v* tag, and the
    # tag run builds and publishes the same commit, so the branch run is skipped. Same
    # condition on the other build jobs.
    if: ${{ !(github.event_name == 'push' && github.ref_type == 'branch' && startsWith(github.event.head_commit.message, 'Version ')) }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Build installer
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Oats-Setup
          path: dist/Oats-Setup-*.exe
          if-no-files-found: error

      # 16 kHz mono 16-bit, the format the app records.
      - name: Synthesize test speech
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $speech = New-Object System.Speech.Synthesis.SpeechSynthesizer
          if ($speech.GetInstalledVoices().Count -eq 0) { throw 'No Windows speech voices installed on this runner.' }
          $format = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $speech.SetOutputToWaveFile("$env:RUNNER_TEMP\speech.wav", $format)
          $speech.Speak('Hi everyone, thanks for joining the call. Let us start with the roadmap for the next quarter.')
          $speech.Dispose()

      - name: Smoke-test audio sidecar
        shell: pwsh
        run: node scripts/smoke-sidecar.mjs dist/win-unpacked "$env:RUNNER_TEMP\speech.wav"

  macos:
    if: ${{ !(github.event_name == 'push' && github.ref_type == 'branch' && startsWith(github.event.head_commit.message, 'Version ')) }}
    # Apple Silicon with Xcode 26: the pinned swift-collections (via WhisperKit and
    # FluidAudio) needs Swift 6.2 or newer, which Xcode 16 on macos-15 doesn't have.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - run: swift --version

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # WhisperKit and FluidAudio take several minutes to compile from scratch.
      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: native/audio/.build
          key: swift-${{ runner.os }}-${{ hashFiles('native/audio/Package.resolved', 'native/audio/Package.swift', 'native/audio/Sources/**') }}
          restore-keys: swift-${{ runner.os }}-

      # Builds the Swift sidecar and TCC addon, packages Oats.app and signs it ad hoc.
      - name: Build Oats.app
        run: npm run dist:mac

      - name: Check the bundle
        run: |
          app=dist/mac-arm64/Oats.app
          codesign --verify --deep --strict "$app"
          test -x "$app/Contents/Resources/oats-audio"
          test -f "$app/Contents/Resources/oats_tcc.node"
          # Without a subcommand the sidecar prints its usage and exits 1; anything else means it can't start.
          if "$app/Contents/Resources/oats-audio" 2> usage.txt; then exit 1; fi
          grep -q 'usage:' usage.txt

      # ditto keeps the framework symlinks and signature that a plain artifact upload would break.
      - name: Zip Oats.app
        run: ditto -c -k --keepParent dist/mac-arm64/Oats.app dist/Oats-mac-arm64.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Oats-mac-arm64
          path: dist/Oats-mac-arm64.zip
          if-no-files-found: error

  macos-intel:
    if: ${{ !(github.event_name == 'push' && github.ref_type == 'branch' && startsWith(github.event.head_commit.message, 'Version ')) }}
    # A real Intel runner, so the packaged Node sidecar (whisper.cpp / sherpa-onnx) is
    # smoke-tested on the architecture it ships for. No Swift here: Intel Macs don't
    # use the WhisperKit helper, so this job doesn't need Xcode 26.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Builds the universal TCC addon, packages Oats.app for x64 and signs it ad hoc.
      - name: Build Oats.app
        run: npm run dist:mac-x64

      - name: Check the bundle
        run: |
          app=dist/mac/Oats.app
          codesign --verify --deep --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/Oats")" = x86_64
          lipo -archs "$app/Contents/Resources/oats_tcc.node" | grep -q x86_64
          test -d "$app/Contents/Resources/app.asar.unpacked/node_modules/sherpa-onnx-darwin-x64"
          test -d "$app/Contents/Resources/app.asar.unpacked/node_modules/@fugood/node-whisper-darwin-x64"
          # The Swift helper is Apple Silicon only and must not ship here.
          test ! -e "$app/Contents/Resources/oats-audio"

      # 16 kHz mono 16-bit, the format the app records.
      - name: Synthesize test speech
        run: |
          say -o "$RUNNER_TEMP/speech.aiff" 'Hi everyone, thanks for joining the call. Let us start with the roadmap for the next quarter.'
          afconvert -f WAVE -d LEI16@16000 -c 1 "$RUNNER_TEMP/speech.aiff" "$RUNNER_TEMP/speech.wav"

      - name: Smoke-test audio sidecar
        run: node scripts/smoke-sidecar.mjs dist/mac/Oats.app "$RUNNER_TEMP/speech.wav"

      # ditto keeps the framework symlinks and signature that a plain artifact upload would break.
      - name: Zip Oats.app
        run: ditto -c -k --keepParent dist/mac/Oats.app dist/Oats-mac-x64.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Oats-mac-x64
          path: dist/Oats-mac-x64.zip
          if-no-files-found: error

  # Tags only: puts all three builds in Cloudflare R2 behind the landing's download links.
  # Setup (bucket, domain, secrets) is described in README → "Загрузки на Cloudflare R2".
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, macos-intel]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Upload to R2
        env:
          # The account ID isn't secret, so a repository variable works too.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'oats-downloads' }}
        run: scripts/publish-r2.sh "$GITHUB_REF_NAME" release
