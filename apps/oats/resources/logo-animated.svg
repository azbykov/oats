<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The logo (shared/src/renderer/src/assets/logo.svg), self-animating for the README and the web:
       the grain drops in, then wiggles every 6s. Same motion as components/Logo.tsx. -->
  <style>
    .grain { transform-box: view-box; transform-origin: 32px 32px; transform: rotate(-32deg);
      animation: drop 900ms cubic-bezier(.3, 1.4, .5, 1) both; }
    .sway { transform-box: view-box; transform-origin: 32px 50px;
      animation: sway 6s ease-in-out 2s infinite; }
    .groove { stroke-dasharray: 34; animation: draw 400ms ease-out 500ms both; }
    @keyframes drop {
      0% { transform: translateY(-40px) rotate(-120deg) scale(.6); opacity: 0; }
      40% { opacity: 1; }
      100% { transform: rotate(-32deg); }
    }
    @keyframes draw { from { stroke-dashoffset: 34; } to { stroke-dashoffset: 0; } }
    @keyframes sway {
      0%, 18%, 100% { transform: none; }
      3.6% { transform: rotate(16deg); }
      8.1% { transform: rotate(-10deg); }
      12.6% { transform: rotate(5deg); }
      15.8% { transform: rotate(-2deg); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="64" height="64" rx="16" fill="#313225"/>
  <g class="sway">
    <g class="grain">
      <ellipse cx="32" cy="32" rx="11" ry="21" fill="#d1e043"/>
      <path class="groove" d="M32 15v34" stroke="#313225" stroke-width="2.6" stroke-linecap="round" opacity=".55"/>
    </g>
  </g>
</svg>
