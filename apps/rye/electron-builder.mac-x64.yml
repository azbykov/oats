# Intel Mac build (npm run dist:mac-x64:rye). Same app; audio runs on the Node sidecar
# (whisper.cpp / sherpa-onnx, see shared/src/main/sidecar.ts) because WhisperKit and
# FluidAudio need Apple Silicon, so there is no Swift helper and no arm64 addons.
extends: ./electron-builder.yml
mac:
  files:
    - "!**/node_modules/sherpa-onnx-darwin-arm64/**"
    - "!**/node_modules/@fugood/node-whisper-darwin-arm64/**"
    - "!**/node_modules/better-sqlite3-multiple-ciphers/prebuilds/darwin-arm64.node"
