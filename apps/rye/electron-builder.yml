# Packages Rye.app / Rye Setup.exe. A real app bundle matters on macOS: privacy
# permissions (microphone, system audio) are granted per app, and only a bundle
# with its own identity and usage descriptions gets the system prompts.
# Its own id is what makes Rye a separate app to the system: its own permissions, keychain
# entry and data folder, next to Oats.
appId: app.rye.desktop
productName: Rye
directories:
  # Its own folder under dist/: the unpacked builds are named after the platform, not the app.
  output: ../../dist/rye
# Builds are attached to CI runs, not published; without this electron-builder
# infers a GitHub release target from the git remote and tries to upload on tags.
publish: null
# Every native addon comes prebuilt (N-API), so there is nothing to compile for Electron.
# Without this electron-builder rebuilds better-sqlite3-multiple-ciphers from source,
# because it ships a binding.gyp next to its prebuilt binaries.
npmRebuild: false
# Each platform lists its files in full (a platform `files` replaces this one): the
# app itself, minus whisper.cpp's CUDA (~125 MB) and WASM builds (Vulkan covers
# NVIDIA too) and the other platform's addons, which a cross-build has installed.
files:
  - out/**
  - package.json
  - "!**/node_modules/@fugood/node-whisper-*-cuda/**"
  - "!**/node_modules/@fugood/node-whisper-wasm/**"
  - "!**/node_modules/better-sqlite3-multiple-ciphers/{deps,src}/**"
  - "!**/node_modules/better-sqlite3-multiple-ciphers/prebuilds/linux*"
# Native addons and the DLLs/dylibs next to them must be real files on disk.
# rye:// links open the app; the browser tab that finishes a sign-in uses one.
protocols:
  - name: Rye
    schemes: [rye]
asarUnpack:
  - "**/node_modules/sherpa-onnx-*/**"
  - "**/node_modules/@fugood/node-whisper-*/**"
  - "**/node_modules/onnxruntime-node/bin/**"
  - "**/node_modules/better-sqlite3-multiple-ciphers/prebuilds/**"
mac:
  target: dir
  files:
    - out/**
    - package.json
    - "!**/node_modules/@fugood/node-whisper-*-cuda/**"
    - "!**/node_modules/@fugood/node-whisper-wasm/**"
    - "!**/node_modules/sherpa-onnx-win-*/**"
    - "!**/node_modules/@fugood/node-whisper-win32-*/**"
    # The encrypted database (better-sqlite3-multiple-ciphers): source and other systems' builds stay out.
    - "!**/node_modules/better-sqlite3-multiple-ciphers/{deps,src}/**"
    - "!**/node_modules/better-sqlite3-multiple-ciphers/prebuilds/{linux,win32}*"
    # Semantic search (onnxruntime-node): macOS arm64 only; the binding loads libonnxruntime.1.dylib.
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/{linux,win32}/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/darwin/*/libonnxruntime.1.*.*.dylib"
  category: public.app-category.productivity
  # Generated from resources/icon.svg by scripts/build-icons.sh.
  icon: resources/icon.icns
  # Signed ad hoc after packaging (see the dist:mac script); no Developer ID needed locally.
  identity: null
  hardenedRuntime: false
  # Per-architecture additions (Swift helper, which addons to drop) live in
  # electron-builder.mac-arm64.yml / electron-builder.mac-x64.yml; lists there are
  # added to these, not replacing them.
  extraResources:
    - from: ../../native/tcc/build/Release/oats_tcc.node
      to: oats_tcc.node
  extendInfo:
    NSMicrophoneUsageDescription: Rye transcribes your side of the conversation.
    NSAudioCaptureUsageDescription: Rye transcribes the other side of your online sessions from system audio.
win:
  icon: resources/icon.ico
  files:
    - out/**
    - package.json
    - "!**/node_modules/@fugood/node-whisper-*-cuda/**"
    - "!**/node_modules/@fugood/node-whisper-wasm/**"
    - "!**/node_modules/sherpa-onnx-darwin-*/**"
    - "!**/node_modules/@fugood/node-whisper-darwin-*/**"
    - "!**/node_modules/better-sqlite3-multiple-ciphers/{deps,src}/**"
    - "!**/node_modules/better-sqlite3-multiple-ciphers/prebuilds/{linux,darwin}*"
    - "!**/node_modules/better-sqlite3-multiple-ciphers/prebuilds/win32-arm64.node"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/{linux,darwin,win32/arm64}/**"
  target:
    - target: nsis
      arch: x64
  # Needed by electron-updater on Windows; electron-builder only writes it when publishing.
  extraResources:
    - from: resources/win/app-update.yml
      to: app-update.yml
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Rye-Setup-${version}.${ext}
